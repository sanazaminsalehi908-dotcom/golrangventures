<title>استراتژی GFS دارو</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap">
<style id="pg-style">
/* Layout: alternating night (navy) and paper bands, like the GFS deck; each band carries one animated exhibit (molecule to capsule, overlap, rings, chain, flow, hub, timeline). Experience = lime; outcomes = cyan; everything else quiet. */
:root {
  --night: #0b1530;        /* navy bands, both themes */
  --night-2: #13224a;      /* cards on navy */
  --night-line: #24396e;
  --night-ink: #f2f4ea;
  --night-muted: #b5c0d8;
  --paper: #f2f4ea;        /* light bands */
  --card: #fbfcf6;
  --ink: #0b1530;
  --muted: #4a5570;
  --line: #d6dbc4;
  --lime: #cedc45;
  --lime-ink: #5f6e0a;
  --lime-soft: #eef3c9;
  --cyan: #3fd6e8;
  --teal: #1a6e86;
  --teal-soft: #dff1f4;
  --edge: #8e98b0;
  --font: "Vazirmatn", Tahoma, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --night: #060d22; --night-2: #101d40; --night-line: #22356a;
    --paper: #0b1530; --card: #13224a; --ink: #f2f4ea; --muted: #b5c0d8; --line: #24396e;
    --lime-ink: #cedc45; --lime-soft: #2a3424; --teal: #3fd6e8; --teal-soft: #16304d; --edge: #6d7794;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --night: #060d22; --night-2: #101d40; --night-line: #22356a;
  --paper: #0b1530; --card: #13224a; --ink: #f2f4ea; --muted: #b5c0d8; --line: #24396e;
  --lime-ink: #cedc45; --lime-soft: #2a3424; --teal: #3fd6e8; --teal-soft: #16304d; --edge: #6d7794;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.85; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }

.band { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 72px; }
.band.night { background: var(--night); color: var(--night-ink); }
.band.paper { background: var(--paper); color: var(--ink); }
.band.lime { background: var(--lime); color: #0b1530; padding-block: 56px; }
.inner { max-width: 1120px; margin-inline: auto; display: grid; gap: 28px; min-width: 0; }
.eyebrow { font-size: .9rem; font-weight: 700; letter-spacing: .01em; color: var(--teal); }
.night .eyebrow { color: var(--cyan); }
h2 { font-size: clamp(1.8rem, 4.4vw, 3rem); font-weight: 800; line-height: 1.25; }
h3 { font-size: 1.15rem; font-weight: 800; line-height: 1.5; }
.lead { max-width: 64ch; color: var(--muted); font-size: 1.05rem; }
.night .lead { color: var(--night-muted); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: center; }
.art svg { display: block; width: 100%; height: auto; }

/* hero */
.hero { padding-block: 48px 64px; background: radial-gradient(circle at 20% 45%, #1b2f66 0%, var(--night) 62%); }
.hero .inner { grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); align-items: center; gap: 24px 48px; }
.hero-text { display: grid; gap: 18px; }
.logo { width: 250px; max-width: 70%; height: auto; display: block; }
.hero h1 { font-size: clamp(2.4rem, 7vw, 4.4rem); font-weight: 900; line-height: 1.12; letter-spacing: -.01em; }
.hero h1 em { font-style: normal; color: var(--lime); }
.hero .lead b { color: var(--night-ink); }
.byline { font-size: .85rem; color: var(--night-muted); border-top: 1px solid var(--night-line); padding-top: 14px; }
.rise { animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
.rise.d1 { animation-delay: .12s; } .rise.d2 { animation-delay: .24s; } .rise.d3 { animation-delay: .36s; }
@keyframes rise { from { transform: translateY(18px); opacity: .001; } to { transform: none; opacity: 1; } }

/* decisions */
.decisions { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; counter-reset: d; }
.decisions li { counter-increment: d; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 28px; display: grid; gap: 10px; align-content: start; box-shadow: 0 12px 32px rgb(11 21 48 / .06); transition: transform .25s, box-shadow .25s; }
.decisions li:hover { transform: translateY(-4px); box-shadow: 0 18px 40px rgb(11 21 48 / .1); }
.decisions li::before { content: "تصمیم " counter(d, persian); justify-self: start; font-size: .82rem; font-weight: 800; color: #0b1530; background: var(--lime); border-radius: 999px; padding: 2px 14px; }
.decisions h3 { font-size: 1.45rem; }
.decisions p { color: var(--muted); }

/* statement band */
.statement { font-size: clamp(1.4rem, 3.6vw, 2.3rem); font-weight: 900; line-height: 1.45; max-width: 30ch; }
.statement-sub { max-width: 70ch; font-weight: 500; }
.lime .inner { grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 24px 40px; }
.lime .star-wrap { width: 132px; }

/* lists on night */
.goals { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; counter-reset: g; }
.goals li { counter-increment: g; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 2px 16px; align-items: start; }
.goals li::before { content: counter(g, persian); grid-row: span 2; width: 48px; height: 48px; border-radius: 50%; background: var(--lime); color: #0b1530; font-weight: 900; font-size: 1.2rem; display: grid; place-items: center; line-height: 1; }
.goals b { font-size: 1.1rem; }
.goals span { color: var(--night-muted); font-size: .95rem; }
.note-strip { color: var(--night-muted); font-size: .92rem; border-top: 1px solid var(--night-line); padding-top: 14px; }

/* audience */
.prio { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
.prio li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 0 16px; align-items: center; }
.dot { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--ink); grid-row: span 2; }
.dot.p1 { background: var(--lime); } .dot.p2 { background: var(--cyan); border-color: var(--teal); } .dot.p3 { background: var(--line); border-color: var(--muted); }
.prio b { font-size: 1.1rem; } .prio span { color: var(--muted); font-size: .95rem; }
.count { display: flex; gap: 20px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 18px 24px; }
.count .big { font-size: clamp(2.4rem, 6vw, 3.6rem); font-weight: 900; line-height: 1; white-space: nowrap; }
.count p { color: var(--muted); }

/* chain */
.stations { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; text-align: center; }
.stations b { display: block; font-size: 1.1rem; } .stations span { color: var(--night-muted); font-size: .9rem; }
.quote { font-size: clamp(1.2rem, 2.8vw, 1.6rem); font-weight: 800; line-height: 1.6; border-inline-start: 6px solid var(--lime); padding-inline-start: 20px; max-width: 46ch; }
.gets { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.gets li { background: var(--night-2); border: 1px solid var(--night-line); border-radius: 22px; padding: 22px; display: grid; gap: 8px; align-content: start; transition: transform .25s, border-color .25s; }
.gets li:hover { transform: translateY(-4px); border-color: var(--lime); }
.gets svg { width: 40px; height: 40px; justify-self: start; }
.gets p { color: var(--night-muted); font-size: .93rem; }
.gets li.key { background: var(--lime); border-color: var(--lime); color: #0b1530; }
.gets li.key p { color: #2a3424; }

/* tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 18px; background: var(--card); }
table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: .95rem; line-height: 1.8; }
th, td { text-align: start; vertical-align: top; padding: 12px 18px; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
thead th { background: var(--ink); color: var(--paper); font-size: .85rem; font-weight: 700; }
thead th:first-child { color: var(--lime); }
td:first-child { font-weight: 700; }
td.num { white-space: nowrap; font-variant-numeric: tabular-nums; }
.night .table-wrap { background: var(--night-2); border-color: var(--night-line); }
.night thead th { background: #060d22; color: var(--night-ink); }
.night thead th:first-child { color: var(--lime); }
.night td { border-color: var(--night-line); }
.night td:first-child { color: var(--night-ink); }
.night td:not(:first-child) { color: var(--night-muted); }

/* diagrams */
.fig { overflow-x: auto; border-radius: 24px; }
.fig svg { display: block; width: 100%; min-width: 640px; height: auto; font-family: var(--font); }
.t-ink { fill: var(--night-ink); } .t-muted { fill: var(--night-muted); } .t-lime { fill: var(--lime); } .t-dark { fill: #0b1530; }
.p-ink { fill: var(--ink); } .p-muted { fill: var(--muted); } .p-lime { fill: var(--lime-ink); }
.b-box { fill: var(--night-2); stroke: #3a4f86; stroke-width: 2; }
.b-key { fill: var(--lime); stroke: var(--lime); stroke-width: 2; }
.b-out { fill: #16304d; stroke: var(--cyan); stroke-width: 2; }
.b-other { fill: none; stroke: #6c7faf; stroke-width: 2; stroke-dasharray: 7 6; }
.ln { fill: none; stroke: #4a5f96; stroke-width: 2; }
.ln-flow { fill: none; stroke: var(--cyan); stroke-width: 3; stroke-dasharray: 3 12; animation: flow 1.2s linear infinite; }
.arrowhead { fill: #6c7faf; }
@keyframes flow { to { stroke-dashoffset: -15; } }
.glow { animation: glow 2.6s ease-in-out infinite; }
@keyframes glow { 0%, 100% { opacity: .15; } 50% { opacity: .55; } }

.tracks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.track { background: var(--night-2); border: 1px solid var(--night-line); border-top: 6px solid var(--cyan); border-radius: 22px; padding: 24px; display: grid; gap: 8px; align-content: start; }
.track.inno { border-top-color: var(--lime); }
.track .tag { font-size: .85rem; font-weight: 800; color: var(--cyan); } .track.inno .tag { color: var(--lime); }
.track p { color: var(--night-muted); }
.track .out { color: var(--night-ink); font-weight: 700; border-top: 1px solid var(--night-line); padding-top: 10px; }

/* message */
.message { display: grid; gap: 12px; }
.message strong { font-size: clamp(2rem, 6vw, 3.8rem); font-weight: 900; line-height: 1.2; color: var(--lime-ink); }

/* kpis */
.stats { display: grid; grid-template-columns: 1.4fr repeat(3, minmax(0, 1fr)); gap: 14px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 24px; display: grid; gap: 4px; align-content: start; }
.stat .n { font-size: clamp(2.6rem, 5.5vw, 4rem); font-weight: 900; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .l { font-weight: 800; } .stat .s { color: var(--muted); font-size: .88rem; }
.stat.key { background: var(--night); border-color: var(--night); color: var(--night-ink); box-shadow: 0 20px 48px rgb(11 21 48 / .25); }
.stat.key .n { color: var(--lime); font-size: clamp(3.4rem, 8vw, 6rem); }
.stat.key .s { color: var(--night-muted); }
.longterm { background: var(--lime); color: #0b1530; border-radius: 20px; padding: 18px 24px; font-weight: 800; font-size: 1.1rem; }

/* risks */
.risk-top { background: var(--night); color: var(--night-ink); border-radius: 28px; padding: 32px; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px 36px; box-shadow: 0 24px 56px rgb(11 21 48 / .25); }
.risk-top .tag { grid-column: 1 / -1; color: var(--lime); font-weight: 800; font-size: .9rem; }
.risk-top h3 { font-size: clamp(1.4rem, 3vw, 2rem); line-height: 1.4; }
.risk-top p { color: var(--night-muted); }
.risk-top .fix { border-inline-start: 2px solid var(--night-line); padding-inline-start: 28px; display: grid; gap: 6px; align-content: center; }
.risk-top .fix b { color: var(--lime); font-size: .85rem; }
.risk-top .fix p { color: var(--night-ink); font-weight: 800; font-size: 1.15rem; }

/* next */
.asks { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: a; }
.asks li { counter-increment: a; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 16px; align-items: center; font-weight: 700; font-size: 1.08rem; }
.asks li::before { content: counter(a, persian); width: 56px; height: 56px; border-radius: 50%; background: #0b1530; color: var(--lime); font-weight: 900; font-size: 1.3rem; display: grid; place-items: center; line-height: 1; }
.cta { background: #0b1530; color: var(--lime); border-radius: 999px; padding: 18px 32px; font-weight: 800; font-size: 1.1rem; justify-self: start; }
.steps { margin: 0; padding-inline-start: 1.3em; display: grid; gap: 4px; }
.ask-grid { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px 40px; align-items: start; }

footer { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px 56px; background: var(--night); color: var(--night-muted); font-size: .88rem; }
footer .inner { gap: 10px; }
footer ul { margin: 0; padding-inline-start: 1.2em; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 24px; }
footer a { color: var(--cyan); }

nav.toc { display: flex; flex-wrap: wrap; gap: 8px; }
nav.toc a { font-size: .88rem; color: var(--ink); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; background: var(--card); transition: background .2s, border-color .2s; }
nav.toc a:hover, nav.toc a:focus-visible { border-color: var(--lime-ink); background: var(--lime-soft); outline: none; }
a:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

/* ambient svg motion */
.spin-slow { animation: spin 30s linear infinite; }
.spin-star { animation: spin 14s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.twinkle { animation: tw 3.2s ease-in-out infinite; }
@keyframes tw { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
.pulse { animation: pu 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pu { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.4); } }
.float { animation: fl 5s ease-in-out infinite; }
@keyframes fl { 0%, 100% { transform: translateY(0) rotate(-28deg); } 50% { transform: translateY(-22px) rotate(-20deg); } }
.dash { stroke-dasharray: 6 16; animation: da 1.6s linear infinite; }
@keyframes da { to { stroke-dashoffset: -44; } }
.ripple { animation: rip 3.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes rip { 0% { transform: scale(.4); opacity: .7; } 100% { transform: scale(1.05); opacity: 0; } }
.ping { animation: ping 6s ease-out infinite; transform-box: fill-box; transform-origin: center; opacity: 0; }
@keyframes ping { 0% { transform: scale(1); opacity: .9; } 18% { transform: scale(1.7); opacity: 0; } 100% { opacity: 0; } }
.slide-l { animation: sl 1.6s cubic-bezier(.2,.8,.2,1) both; } .slide-r { animation: sr 1.6s cubic-bezier(.2,.8,.2,1) both; }
@keyframes sl { from { transform: translateX(-90px); } to { transform: none; } }
@keyframes sr { from { transform: translateX(90px); } to { transform: none; } }
.breath { animation: br 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes br { 0%, 100% { transform: scale(1); opacity: .35; } 50% { transform: scale(1.12); opacity: .08; } }

@media (max-width: 860px) {
  .hero .inner, .split, .lime .inner, .ask-grid { grid-template-columns: minmax(0, 1fr); }
  .hero .art { max-width: 340px; justify-self: center; }
  .decisions, .tracks, .risk-top { grid-template-columns: minmax(0, 1fr); }
  .gets, .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat.key { grid-column: 1 / -1; }
  .stations { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .risk-top .fix { border-inline-start: 0; padding-inline-start: 0; border-top: 1px solid var(--night-line); padding-top: 14px; }
  footer ul { grid-template-columns: minmax(0, 1fr); }
  .band { padding-block: 56px; }
}
@media (max-width: 480px) { .gets { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* in-place editing */
.pg-bar { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: calc(16px + env(safe-area-inset-left, 0px)); z-index: 20; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; max-width: calc(100vw - 32px); background: var(--night); color: var(--night-ink); border: 1px solid var(--night-line); border-radius: 999px; padding: 6px; box-shadow: 0 12px 32px rgb(0 0 0 / .3); font-family: var(--font); direction: rtl; }
.pg-bar button { font: inherit; font-size: .9rem; font-weight: 800; border: 0; border-radius: 999px; padding: 8px 18px; cursor: pointer; background: transparent; color: var(--night-ink); }
.pg-bar #pg-edit, .pg-bar #pg-save { background: var(--lime); color: #0b1530; }
.pg-bar button:disabled { opacity: .5; cursor: default; }
.pg-bar button:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
#pg-msg { font-size: .82rem; color: var(--night-muted); padding-inline: 8px; }
#pg-msg:empty { display: none; }
.editing [data-k] { outline: 1.5px dashed var(--lime); outline-offset: 3px; border-radius: 4px; cursor: text; }
.editing [data-k]:focus { outline: 2.5px solid var(--lime); }
</style>

      <p class="eyebrow rise d1">استراتژی برگزاری GFS دارو · نسخهٔ دارویی ستارگان آینده گلرنگ</p>
      <h1 class="rise d1">دانش در دسترس همه است؛ <em>تجربه</em> نه.</h1>
      <p class="lead rise d2">دانش تئوری داروسازی امروز در کلاس، کتاب و اینترنت در دسترس همه است؛ تجربهٔ واقعی کار در صنعت دارو نه. <b>GFS دارو</b>، برنامهٔ مشترک گلرنگ ونچرز و سرمایه‌گذاری دارویی گلرنگ، این تجربه را فراهم می‌کند تا دانشجو، پیش از انتخاب شغل یا مسیرش، بفهمد واقعاً چه دوست دارد.</p>
      <p class="byline rise d3">۴ آبان ۱۴۰۵ · پیش‌نویس ۲ برای گفت‌وگو با گلرنگ ونچرز و سرمایه‌گذاری دارویی گلرنگ</p>

  <div class="inner">
    <p class="eyebrow">ایده در سه تصمیم</p>
    <h2 id="h-dec">تجربه می‌سازیم، نه کلاس</h2>
    <ol class="decisions">
      <li><h3>تجربه، نه کلاس</h3><p>دانشجو کنار یک منتور روی یک مسئلهٔ واقعی کار می‌کند؛ برنامه آموزش تئوری تکراری نمی‌دهد.</p></li>
      <li><h3>اول دیدن، بعد انتخاب</h3><p>دوره با یک تور ۲ تا ۳ روزه از کل زنجیرهٔ دارو شروع می‌شود و بعد دانشجو در بخشی که دوستش دارد روی یک پروژه کار می‌کند. چرخش بین چند شرکت عملیاتی نیست و کنار گذاشته شد.</p></li>
      <li><h3>جذب از مسیر هلدینگ</h3><p>هلدینگ دارویی همین حالا با دانشکده‌های داروسازی ارتباط دارد و فراخوان از همین مسیر منتشر می‌شود؛ کانال جدیدی لازم نیست.</p></li>
    </ol>

      <p class="eyebrow">چرا با هم</p>
      <h2 id="h-why">پنج هدف مشترک، یک برنامه</h2>
      <ol class="goals">
        <li><b>هم‌افزایی با زنجیرهٔ ارزش</b><span>مسئله‌های دوره از شرکت‌های هلدینگ می‌آیند، نه از کتاب درسی</span></li>
        <li><b>تبدیل پژوهش به کسب‌وکار</b><span>مسیر نوآوری با ورودی مستقیم به مرکز نوآوری و شتاب‌دهنده</span></li>
        <li><b>تأمین نیروی متخصص</b><span>کسی که با تجربه این مسیر را انتخاب کرده، انتخابش آگاهانه‌تر است و ماندگارتر</span></li>
        <li><b>تصویر تازهٔ گلرنگ</b><span>از «کالای مصرفی» به «دارو و فناوری»؛ جایی که دانشجو اولین تجربهٔ واقعی صنعت دارو را داشته</span></li>
        <li><b>حضور بین‌المللی</b><span>آشنایی با ثبت دارو و استاندارد جهانی، برای هدف ۶۰٪ فروش خارجی گروه</span></li>
      </ol>
      <p class="note-strip">همکاری از قبل هست: شتاب‌دهی داروهای آهسته‌رهش و پپتیدی با واریان فارمد، و ابیان فارمد و سروش مانا فارمد در سبد هر دو.</p>

      <p class="lead">پیام اصلی تجربه است، نه وعدهٔ استخدام. فرصت بورسیه، کار و شتاب‌دهی برای برترها هم گفته می‌شود، ولی تیتر نیست. کانال اصلی، ارتباطی است که هلدینگ همین حالا با دانشکده‌های داروسازی دارد؛ کانال یا رویداد بیرونی تازه‌ای لازم نیست.</p>

        <tr><td>رویداد ۳ ساعتهٔ معرفی</td><td>کار گروهی روی یک مسئلهٔ واقعی، تا دانشجو طعم تجربه را همان‌جا بچشد</td></tr>

<script id="pg-script">(() => {
  const SEL = 'h1,h2,h3,p,li,td,th,.stations b,.stations span,.goals b,.goals span,.prio b,.prio span,.stat span,.count .big';
  const HEAD = '<title>استراتژی GFS دارو</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap">\n';
  const RESET = ':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}';
  const CSS = document.getElementById('pg-style').textContent;
  const JS = document.getElementById('pg-script').textContent;
  const tpl = document.getElementById('pg-doc');
  const app = document.getElementById('app');
  const reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const FA = '۰۱۲۳۴۵۶۷۸۹';
  const fa = n => String(n).replace(/\d/g, d => FA[d]);
  let editing = false;
  const dirty = new Set();

  // Number the editable leaves of the page source so the live copy and the source line up.
  let i = 0;
  tpl.content.querySelectorAll(SEL).forEach(el => {
    if (el.closest('svg') || el.querySelector(SEL)) return;
    el.setAttribute('data-k', 'k' + (i++));
  });

  let io = null;
  function countUp() {
    if (reduce || !('IntersectionObserver' in window)) return;
    io = new IntersectionObserver(entries => entries.forEach(en => {
      if (!en.isIntersecting || editing) return;
      io.unobserve(en.target);
      const el = en.target, txt = el.textContent, m = txt.match(/[۰-۹0-9]+/);
      if (!m) return;
      const end = +m[0].replace(/[۰-۹]/g, d => FA.indexOf(d)), pre = txt.slice(0, m.index), suf = txt.slice(m.index + m[0].length);
      const t0 = performance.now(), dur = 1100;
      const step = t => {
        if (editing) { el.textContent = txt; return; }
        const k = Math.min(1, (t - t0) / dur);
        el.textContent = pre + fa(Math.round(end * (1 - Math.pow(1 - k, 3)))) + suf;
        if (k < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }), { threshold: .6 });
    app.querySelectorAll('.stat .n').forEach(el => io.observe(el));
  }

  function render() {
    if (io) io.disconnect();
    app.replaceChildren(tpl.content.cloneNode(true));
    if (reduce) app.querySelectorAll('svg').forEach(s => { try { s.pauseAnimations(); } catch (e) {} });
    countUp();
  }
  render();

  // Keep only simple inline markup from edited text.
  function clean(el) {
    const t = document.createElement('template');
    t.innerHTML = el.innerHTML;
    const walk = n => [...n.childNodes].forEach(c => {
      if (c.nodeType === 8) { c.remove(); return; }
      if (c.nodeType !== 1) return;
      walk(c);
      const tag = c.tagName;
      if (tag === 'B' || tag === 'STRONG' || tag === 'EM' || tag === 'BR' || tag === 'A') {
        const href = tag === 'A' ? c.getAttribute('href') : null;
        [...c.attributes].forEach(a => c.removeAttribute(a.name));
        if (href && /^https?:\/\//i.test(href)) c.setAttribute('href', href);
      } else {
        c.replaceWith(...c.childNodes);
      }
    });
    walk(t.content);
    const box = document.createElement('div');
    box.append(t.content);
    return box.innerHTML.replace(/ /g, ' ').trim();
  }

  function buildPage() {
    const src = tpl.content.cloneNode(true);
    src.querySelectorAll('[data-k]').forEach(el => el.removeAttribute('data-k'));
    const box = document.createElement('div');
    box.append(src);
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>'
      + HEAD + '<style id="pg-style">' + CSS + '</style>\n<div id="app"></div>\n<template id="pg-doc">' + box.innerHTML + '</' + 'template>\n<script id="pg-script">' + JS + '</' + 'script>\n</body></html>';
  }

  const cl = window.claude;
  if (!cl || typeof cl.use !== 'function') return;
  cl.use('artifact').then(art => {
    if (!art) return;
    const bar = document.createElement('div');
    bar.className = 'pg-bar';
    bar.innerHTML = '<button type="button" id="pg-edit">ویرایش متن</button><button type="button" id="pg-save" hidden>ذخیره</button><button type="button" id="pg-cancel" hidden>انصراف</button><span id="pg-msg" role="status"></span>';
    document.body.append(bar);
    const bEdit = bar.querySelector('#pg-edit'), bSave = bar.querySelector('#pg-save'), bCancel = bar.querySelector('#pg-cancel'), msg = bar.querySelector('#pg-msg');
    const plain = (() => { const d = document.createElement('div'); d.contentEditable = 'plaintext-only'; return d.contentEditable === 'plaintext-only'; })();
    const say = t => { msg.textContent = t; };
    const setMode = on => {
      editing = on;
      app.classList.toggle('editing', on);
      app.querySelectorAll('[data-k]').forEach(el => { if (on) el.contentEditable = plain ? 'plaintext-only' : 'true'; else el.removeAttribute('contenteditable'); });
      bEdit.hidden = on; bSave.hidden = !on; bCancel.hidden = !on;
      if (on) { app.querySelectorAll('.stat .n').forEach(el => { const s = tpl.content.querySelector('[data-k="' + el.dataset.k + '"]'); if (s) el.textContent = s.textContent; }); say('روی هر متنی کلیک کنید و تغییرش دهید.'); }
    };
    app.addEventListener('click', e => { if (editing && e.target.closest('a')) e.preventDefault(); }, true);
    app.addEventListener('keydown', e => { if (editing && e.key === 'Enter') e.preventDefault(); });
    app.addEventListener('paste', e => {
      if (!editing || plain) return;
      e.preventDefault();
      document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text/plain'));
    });
    app.addEventListener('input', e => {
      const el = e.target.closest && e.target.closest('[data-k]');
      if (!el) return;
      dirty.add(el.dataset.k);
      say(fa(dirty.size) + ' متن تغییر کرده؛ ذخیره نشده.');
    });
    bEdit.addEventListener('click', () => setMode(true));
    bCancel.addEventListener('click', () => { dirty.clear(); setMode(false); render(); say(''); });
    bSave.addEventListener('click', async () => {
      if (!dirty.size) { setMode(false); say(''); return; }
      dirty.forEach(k => {
        const live = app.querySelector('[data-k="' + k + '"]'), src = tpl.content.querySelector('[data-k="' + k + '"]');
        if (live && src) src.innerHTML = clean(live);
      });
      bSave.disabled = true; bCancel.disabled = true; say('در حال ذخیره…');
      try {
        await art.publish(buildPage());
        say('ذخیره شد.');
      } catch (err) {
        const code = err && err.code;
        bSave.disabled = false; bCancel.disabled = false;
        if (code === 'conflict') say('نسخهٔ جدیدتری ذخیره شده بود؛ صفحه به آن نسخه برمی‌گردد.');
        else if (code === 'not_writer' || code === 'not_granted' || code === 'not_declared' || code === 'consent_required' || code === 'capability_disabled') { say('این نسخه فقط‌خواندنی است؛ برای ذخیره باید دسترسی ویرایش داشته باشید.'); bSave.hidden = true; }
        else if (code === 'too_large') say('صفحه برای ذخیره بیش از حد بزرگ شده است.');
        else say('ذخیره نشد. چند لحظه بعد دوباره «ذخیره» را بزنید.');
      }
    });
  });
})();
</script>
